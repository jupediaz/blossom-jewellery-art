name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-blossom
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, xeon]
    steps:
      - name: Deploy blossom to Xeon
        run: |
          set -euo pipefail
          COMPOSE_DIR="/etc/dokploy/compose/compose-synthesize-cross-platform-panel-c4m29k/code"
          PROJECT="compose-synthesize-cross-platform-panel-c4m29k"
          COMPOSE_FILE="docker-compose.prod.yml"
          cd "$COMPOSE_DIR"
          git pull origin main
          docker compose -f "$COMPOSE_FILE" -p "$PROJECT" build
          docker compose -f "$COMPOSE_FILE" -p "$PROJECT" up -d
          echo "Checking containers are running..."
          sleep 10
          FAILED=$(docker compose -f "$COMPOSE_FILE" -p "$PROJECT" ps --status exited --quiet | wc -l)
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED container(s) exited after deploy"
            docker compose -f "$COMPOSE_FILE" -p "$PROJECT" logs --tail=50
            exit 1
          fi
          echo "Deploy completed successfully"
