name: Deploy Blossom to EPYC

on:
  push:
    branches: [main]
    paths:
      - 'apps/blossom/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'

concurrency:
  group: deploy-blossom-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, epyc]
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
    steps:
      - name: Deploy blossom to EPYC
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Forgejo is the source of truth for what gets deployed; GitHub only
          # triggers this workflow. Whoever pushes to main is expected to push
          # to both remotes.
          git remote set-url origin "http://100.126.7.116:3300/jose/blossom-jewellery-art.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'jose:%s' "$FORGEJO_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$AUTH_HEADER" fetch origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main

          # Deploy whatever is actually HEAD of Forgejo's main right now, not
          # whatever commit happened to trigger this run. cancel-in-progress:
          # false means deploys queue up; by the time an older queued run
          # reaches this line, a later push may already have moved main past
          # its own trigger SHA. Only fail if the trigger commit isn't even in
          # this history (real drift: history rewritten, wrong remote, or
          # Forgejo hasn't received the corresponding push yet).
          TRIGGER_SHA="${{ github.sha }}"
          EXPECTED=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$TRIGGER_SHA" "$EXPECTED"; then
            echo "::error::Forgejo main does not contain $TRIGGER_SHA (the commit that triggered this run). Push it to Forgejo too, or history was rewritten."
            exit 1
          fi
          # Same project name and same compose file that Dokploy and cb-deploy
          # use. Without -p, compose infers the project from the directory it
          # runs in, so deploying apps/blossom/docker-compose.prod.yml raised a
          # second stack called `blossom` that published the identical Traefik
          # router and split traffic across two containers.
          COMPOSE="docker compose -p compose-synthesize-cross-platform-panel-c4m29k -f docker-compose.prod.yml"
          $COMPOSE build
          # Apply pending DB migrations before starting the app. If this fails,
          # set -e aborts the deploy and the app is left untouched.
          $COMPOSE run --rm migrate
          $COMPOSE up -d --no-build app
          echo "Checking app container is running..."
          sleep 10
          FAILED=$($COMPOSE ps --status exited --quiet app | wc -l)
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED container(s) exited after deploy"
            $COMPOSE logs --tail=50
            exit 1
          fi
          echo "Deploy completed successfully"
