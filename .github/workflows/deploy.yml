name: Deploy to Xeon

on:
  push:
    branches: [production]

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, xeon]
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - name: Deploy blossom to Xeon
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git fetch origin production && git reset --hard origin/production
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d --no-build
          echo "Deploy completado: $(date)"

      - name: Health check
        run: |
          echo "Esperando servicio healthy..."
          for i in $(seq 1 12); do
            STATUS=$(curl -sf http://localhost:3000/api/health && echo ok || echo fail)
            echo "  attempt $i: $STATUS"
            [ "$STATUS" = "ok" ] && exit 0
            sleep 5
          done
          echo "ERROR: servicio no healthy tras 60s" && exit 1
