name: Deploy Blossom to Xeon

on:
  push:
    branches: [main]
    paths:
      - 'apps/blossom/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-blossom-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, xeon]
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy blossom to Xeon
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git remote set-url origin https://github.com/${{ github.repository }}.git
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$AUTH_HEADER" fetch origin +refs/heads/main:refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
          EXPECTED="${{ github.sha }}"
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Commit drift: expected $EXPECTED got $ACTUAL"
            exit 1
          fi
          docker compose -f apps/blossom/docker-compose.prod.yml build
          # Apply pending DB migrations before starting the app. If this fails,
          # set -e aborts the deploy and the app is left untouched.
          docker compose -f apps/blossom/docker-compose.prod.yml run --rm migrate
          docker compose -f apps/blossom/docker-compose.prod.yml up -d --no-build app
          echo "Checking app container is running..."
          sleep 10
          FAILED=$(docker compose -f apps/blossom/docker-compose.prod.yml ps --status exited --quiet app | wc -l)
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED container(s) exited after deploy"
            docker compose -f apps/blossom/docker-compose.prod.yml logs --tail=50
            exit 1
          fi
          echo "Deploy completed successfully"
