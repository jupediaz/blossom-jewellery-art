name: Deploy to Xeon

on:
  push:
    branches: [master]

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, xeon]
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - name: Deploy blossom to Xeon
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git remote set-url origin https://github.com/${{ github.repository }}.git
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$AUTH_HEADER" fetch origin +refs/heads/master:refs/remotes/origin/master
          git reset --hard refs/remotes/origin/master
          EXPECTED="${{ github.sha }}"
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Commit drift: expected $EXPECTED got $ACTUAL"
            exit 1
          fi
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d --no-build
          echo "Checking containers are running..."
          sleep 10
          FAILED=$(docker compose -f docker-compose.prod.yml ps --status exited --quiet | wc -l)
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED container(s) exited after deploy"
            docker compose -f docker-compose.prod.yml logs --tail=50
            exit 1
          fi
          echo "Deploy completed successfully"
