name: Deploy to Xeon

on:
  push:
    branches: [master]

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, xeon]
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - name: Deploy blossom to Xeon
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git fetch origin production && git reset --hard origin/production
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d --no-build
          echo "Checking containers are running..."
          sleep 10
          FAILED=$(docker compose -f docker-compose.prod.yml ps --status exited --quiet | wc -l)
          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED container(s) exited after deploy"
            docker compose -f docker-compose.prod.yml logs --tail=50
            exit 1
          fi
          echo "Deploy completed successfully"
